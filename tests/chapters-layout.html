<!doctype html><html lang="en"><meta charset="utf-8"><title>Kotoba layout verification</title>
<style>body{font:14px system-ui;margin:12px;background:#eee}button,select{padding:10px;margin:6px}section{display:flex;gap:16px;flex-wrap:wrap}iframe{height:950px;border:0;background:white}pre{white-space:pre-wrap}label{display:block}h2{font-size:16px}</style>
<h1>Kotoba responsive verification</h1><button id="run">Run layout checks</button><button id="samples">Show chapter samples</button><select id="sample"><option value="clock">Clocks</option><option value="location">Locations</option><option value="long">Long Rebuild</option><option value="vocabulary">Vocabulary</option></select><output id="status">Ready</output><pre id="result"></pre><section>
<div><h2>360px</h2><iframe id="phone360" title="360px Kotoba" width="360" src="index.html"></iframe></div>
<div><h2>390px</h2><iframe id="phone390" title="390px Kotoba" width="390" src="index.html"></iframe></div>
<div><h2>1200px desktop</h2><iframe id="desktop" title="1200px Kotoba" width="1200" src="index.html"></iframe></div></section>
<script>
const frames=[...document.querySelectorAll('iframe')],report={checks:0,errors:[],widths:[360,390,1200]},status=document.querySelector('#status');
// Geometry reads force layout; yield without depending on background-frame animation throttling.
const next=()=>new Promise(resolve=>setTimeout(resolve,0));
function check(frame,label){const d=frame.contentDocument,w=frame.contentWindow,width=w.innerWidth;report.checks++;if(d.documentElement.scrollWidth>width)report.errors.push(`${width}px ${label}: page overflow ${d.documentElement.scrollWidth}`);for(const el of d.querySelectorAll('.conversation-bubble,.lesson-scene,.paper,.activity-options .option,.activity-tile-bank,.reply-tokens,.vocabulary-answer-slots,.vocabulary-tile-bank')){const r=el.getBoundingClientRect();if(r.width&&r.right>width+1)report.errors.push(`${width}px ${label}: ${el.className} crosses right edge`);if(el.scrollWidth>el.clientWidth+2&&!['auto','scroll'].includes(w.getComputedStyle(el).overflowX))report.errors.push(`${width}px ${label}: ${el.className} clips text ${el.scrollWidth}/${el.clientWidth}`);}if(d.body.innerHTML.includes('undefined'))report.errors.push(`${width}px ${label}: undefined`);}
document.querySelector('#run').onclick=async()=>{report.checks=0;report.errors=[];status.textContent='Running';try{for(const frame of frames){const w=frame.contentWindow;for(const lang of ['en','zh-Hant']){w.eval(`state.language=${JSON.stringify(lang)}`);for(const chapter of [3,4]){w.selectDialogueChapter(chapter);check(frame,`${lang} dialogue chapter ${chapter}`);const ids=w.eval('dialogueStudySet().items.map(q=>q.id)');for(const id of ids){w.selectDialogueExpression(id);await next();check(frame,`${lang} guide ${id}`);}for(const kind of ['dialogue-choice','dialogue-tiles']){w.startDialoguePractice(kind);for(const id of ids){w.eval(`state.activity.index=state.activity.ids.indexOf(${JSON.stringify(id)});prepareActivity();render()`);await next();check(frame,`${lang} ${kind} ${id}`);if(w.document.querySelector('.wh-target,.reply-feedback,.breadcrumb-row'))report.errors.push(`answer/feedback/breadcrumb shown before grading ${id}`);w.eval(kind==='dialogue-choice'?'checkActivity(activityCurrent().id)':'{const a=state.activity;for(const unit of kanaUnits(vocabularyReading(activityCurrent())))a.chosen.push(a.tileBank.findIndex((x,i)=>x===unit&&!a.chosen.includes(i)));checkActivity()}');await next();check(frame,`${lang} feedback ${id}`);if(!w.document.querySelector('.reply-feedback.correct'))report.errors.push(`incorrect valid answer ${id}`);}w.gameBack();}
 w.openVocabularyContent(`chapter-${chapter}`);await next();check(frame,`${lang} vocabulary ${chapter}`);for(const mode of ['write','vocabulary-rebuild','kanji-writing']){w.startWordSet(mode,`chapter-${chapter}`);const all=w.eval('state.round.ids');const longest=all.sort((a,b)=>w.eval(`wordBy(${JSON.stringify(b)}).kana.length-wordBy(${JSON.stringify(a)}).kana.length`))[0];w.eval(`state.round.index=state.round.ids.indexOf(${JSON.stringify(longest)});prepareQuestion();render()`);await next();check(frame,`${lang} ${mode} ${chapter}`);if(w.document.querySelector('.breadcrumb-row'))report.errors.push(`game breadcrumb ${mode}`);w.gameBack();}
}status.textContent=`${report.checks} checks`;}}status.textContent=report.errors.length?'FAIL':'PASS';}catch(e){report.errors.push(e.stack);status.textContent='FAIL';}document.querySelector('#result').textContent=JSON.stringify(report,null,2);};
document.querySelector('#samples').onclick=()=>{const selected=document.querySelector('#sample').value;for(const [i,f]of frames.entries()){const w=f.contentWindow;w.eval(`state.language=${JSON.stringify(i===0?'zh-Hant':'en')}`);if(selected==='vocabulary')w.openVocabularyContent('chapter-4');else{w.selectDialogueChapter(selected==='location'?3:4);w.selectDialogueExpression(selected==='location'?'ch3-location-03':selected==='long'?'ch4-phone-answer':'ch4-time-pm');if(selected==='long'){w.startDialoguePractice('dialogue-tiles');w.eval("state.activity.index=state.activity.ids.indexOf('ch4-phone-answer');prepareActivity();render()");}}}};
</script></html>
