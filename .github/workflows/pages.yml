name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build offline asset cache
        run: node scripts/build-pwa.cjs
      - name: Verify PWA
        run: node tests/pwa.cjs
      - name: Verify source-audited exam practice
        run: node tests/exam-practice.cjs
      - name: Verify learning hierarchy and migration
        run: node tests/learning-navigation.cjs
      - name: Verify multi-chapter chips and saved selections
        run: node tests/chapter-chips.cjs
      - name: Verify Lulu visuals and stable feedback
        run: node tests/lulu.cjs
      - name: Verify canonical dialogue games
        run: node tests/dialogue-pairs.cjs
      - name: Verify chapter import
        run: node tests/chapter-import.cjs
      - name: Verify game content and scoring
        run: node tests/verify.cjs
      - name: Verify Number Matching and shared game progress
        run: node tests/number-matching.cjs
      - name: Verify Chapters 3 and 4
        run: node tests/chapters-3-4.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
